id: hl7.eu.phoenix.sact
canonical: http://hl7.eu/fhir/phoenix/sact
name: EuSactRegimenCatalogIg
title: European SACT Regimen Catalog
description: This guide describes a European catalog of Systemic Anti-Cancer Therapy (SACT) regimens - a shared, computable representation of regimen definitions (agents, doses, cycles, supportive care, monitoring and dose modifications) - and its representation in HL7 FHIR.
status: draft # draft | active | retired | unknown
version: 0.1.0
fhirVersion: 4.0.1
copyrightYear: 2026+
releaseLabel: ci-build # ci-build | draft | qa-preview | ballot | trial-use | release | update | normative+trial-use
license: CC0-1.0
jurisdiction: http://unstats.un.org/unsd/methods/m49/m49.htm#150 "Europe"
publisher:
  name: PHOENIX
  url: http://hl7.eu
copyright: >-
  PHOENIX Copyright. Licensed under Common Creative License (CC0 1.0). Details at [Copyright](copyright.html).


